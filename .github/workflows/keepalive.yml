# Free Supabase projects pause after about a week without activity.
# This pings the site every 3 days so the database stays awake.
# Add a repository secret named SITE_URL, e.g. https://your-site.vercel.app (no trailing slash).
name: keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site and database
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "Add the SITE_URL secret first."; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "$SITE_URL/api/health"
